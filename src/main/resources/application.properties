spring.application.name=Decorate-BackService

server.port=8082

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ==================== MySQL \u6570\u636E\u6E90\u914D\u7F6E ====================
spring.datasource.url=jdbc:mysql://localhost:3306/decoration_company_system
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== MyBatis \u914D\u7F6E ====================
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.decoratebackservice.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ==================== SpringDoc OpenAPI (Swagger) \u914D\u7F6E ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
