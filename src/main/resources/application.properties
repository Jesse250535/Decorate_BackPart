# ==================== Image Upload ====================
# Spring Boot default limit is 1MB per file, raise it for avatar / cover upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# Directory for uploaded images (relative to the working directory, absolute path also allowed)
app.upload.dir=uploads
# URL prefix returned to the frontend; must match the vite proxy (/api) and WebMvcConfig mapping
app.upload.url-prefix=/api/uploads

# ==================== Alipay Payment ====================
# mock=true : local simulated cashier, no Alipay gateway, full flow works offline
# Set mock=false and fill app-id / private-key / alipay-public-key to use sandbox or production
# 2026-11-11 09:36 retried the real sandbox on wap: mobilepay.htm returned a
# 9792-byte "系统繁忙，请稍候再试" (systemError) page, same as page channel.
# Keep mock on until Alipay confirms recovery, then set this back to false.
alipay.mock=true
alipay.app-id=9021000171636912
alipay.gateway=https://openapi-sandbox.dl.alipaydev.com/gateway.do
# RSA2 app private key, PKCS8, single line without PEM header
alipay.private-
# Alipay public key generated after uploading your app public key
alipay.alipay-public-
# Async notify URL, must be reachable from the internet (use cpolar/ngrok locally)
alipay.notify-url=http://192.168.43.181:8080/payment/alipay/notify
# Sync return URL (backend), then redirects to alipay.front-url
alipay.return-url=http://192.168.43.181:8080/payment/alipay/return
# Frontend page after payment
alipay.front-url=http://192.168.43.181:5173/renovation
# Pay channel: page = alipay.trade.page.pay (PC cashier)
#              wap  = alipay.trade.wap.pay (mobile/H5 cashier)
# alipay.trade.page.pay (sandbox PC cashier) hit SYSTEM_ERROR ("系统有点儿忙")
# right after the buyer logs in, on 2026-11-08/09/10 - reproduced with a 0.01 CNY
# order on both PC and Android, so it was not amount/device related. Rechecked page
# on 2026-11-11 09:33: still 13950-byte SYSTEM_ERROR page. Also retried wap at 09:36:
# 9792-byte "系统繁忙，请稍候再试" (systemError). Both channels are down, so mock is on.
# Channel is kept on wap for the next real-mode attempt; switch to page if wap recovers.
alipay.pay-channel=wap
