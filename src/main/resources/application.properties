spring.application.name=Decorate-BackService

server.port=8082

# ==================== MySQL 数据源配置 ====================
spring.datasource.url=jdbc:mysql://localhost:3306/decoration_company_system
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== MyBatis 配置 ====================
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.decoratebackservice.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ==================== SpringDoc OpenAPI (Swagger) 配置 ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ==================== Redis 配置 ====================
# 注意：Spring Boot 3.x 配置前缀为 spring.data.redis（2.x 为 spring.redis）
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=5000ms
