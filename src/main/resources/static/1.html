<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户数据展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; padding: 30px; }
        h1 { text-align: center; color: #333; margin-bottom: 24px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        th { background: #409eff; color: #fff; padding: 12px 10px; font-weight: 600; text-align: left; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px #ebeef5 solid; color: #606266; font-size: 14px; }
        tr:hover { background: #ecf5ff; }
        .loading { text-align: center; padding: 40px; color: #909399; font-size: 16px; }
        .error { text-align: center; padding: 40px; color: #f56c6c; }
        .error code { display: block; margin-top: 10px; color: #909399; font-size: 13px; text-align: left; max-width: 600px; margin-left: auto; margin-right: auto; word-break: break-all; }
        .container { max-width: 1400px; margin: 0 auto; }
    </style>
</head>
<body>
<div class="container">
    <h1>用户数据表 (sys_user)</h1>
    <div id="loading" class="loading">正在加载数据...</div>
    <div id="error" class="error" style="display:none;"></div>
    <table id="userTable" style="display:none;">
        <thead>
            <tr>
                <th>ID</th><th>用户名</th><th>手机号</th><th>昵称</th>
                <th>头像</th><th>性别</th><th>用户类型</th><th>角色ID</th>
                <th>简介</th><th>违规次数</th><th>状态</th><th>是否删除</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<script>
    fetch('/findAll')
        .then(res => res.json())
        .then(data => {
            document.getElementById('loading').style.display = 'none';
            const table = document.getElementById('userTable');
            const tbody = document.getElementById('tbody');

            if (!data || data.length === 0) {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerHTML = '暂无数据';
                return;
            }

            data.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${u.id}</td>
                    <td>${u.username || ''}</td>
                    <td>${u.phone || ''}</td>
                    <td>${u.nickname || ''}</td>
                    <td>${u.avatar || ''}</td>
                    <td>${u.gender === 1 ? '男' : u.gender === 2 ? '女' : '未知'}</td>
                    <td>${u.user_type}</td>
                    <td>${u.role_id}</td>
                    <td>${u.profile || ''}</td>
                    <td>${u.violation_count}</td>
                    <td>${u.status === 1 ? '正常' : '禁用'}</td>
                    <td>${u.is_deleted === 1 ? '已删除' : '正常'}</td>
                `;
                tbody.appendChild(tr);
            });

            table.style.display = 'table';
        })
        .catch(err => {
            document.getElementById('loading').style.display = 'none';
            const errEl = document.getElementById('error');
            errEl.style.display = 'block';
            errEl.innerHTML = '数据加载失败<br><code>' + err.message + '</code>';
        });
</script>
</body>
</html>
